<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#06151b">
<meta name="description" content="Stillwater — a quiet, animated sea. Drag to orbit, tap the water to release a body.">
<title>Stillwater — a quiet sea</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<canvas id="gl" aria-label="Animated ocean scene"></canvas>

<!-- atmosphere, drawn in CSS so the GL budget stays on the water -->
<div id="vignette" aria-hidden="true"></div>
<div id="grain" aria-hidden="true"></div>

<header id="hudTop">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
      <path d="M6 15.5c3-3.2 5.4-3.2 8.4 0s5.4 3.2 8.4 0 5.4-3.2 8.4 0"/>
      <path d="M6 21.5c3-3.2 5.4-3.2 8.4 0s5.4 3.2 8.4 0 5.4-3.2 8.4 0"/>
      <path d="M6 27.5c3-3.2 5.4-3.2 8.4 0s5.4 3.2 8.4 0 5.4-3.2 8.4 0" opacity=".45"/>
      <circle cx="20" cy="8.5" r="1.6" fill="currentColor" stroke="none"/>
    </svg>
    <div>
      <h1>Stillwater</h1>
      <p><span>an ocean to disappear into</span><i></i><span id="brandClock">18:24</span></p>
    </div>
  </div>
  <div class="top-right">
    <div class="readout" id="readout" aria-live="off"></div>
    <button class="ghost-btn" id="bFullscreen" title="Fullscreen (double-click stage)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg>
      <span>Fullscreen</span>
    </button>
    <button class="ghost-btn" id="bQuiet" title="Quiet mode (F)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h18M3 6h18M3 18h12"/></svg>
      <span>Quiet</span>
    </button>
  </div>
</header>

<div id="hint" role="status"></div>

<!-- radial menu: eight tools on one orbit -->
<nav class="radial" id="radial" aria-label="Tools"></nav>

<!-- settings panel -->
<aside class="panel" id="panel" aria-label="Settings" aria-hidden="true"></aside>

<!-- returns the interface when it has been hidden by hand -->
<button id="reveal" title="Show interface">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14m-7-7 7 7 7-7"/></svg>
  Interface
</button>

<div id="toast" role="status" aria-live="polite"></div>

<div id="boot">
  <div class="boot-inner">
    <span>Stillwater</span>
    <div class="boot-line"><i></i></div>
  </div>
</div>

<div id="fail">This scene needs WebGL 2. Please update your browser or device.</div>
<div id="err" role="alert"></div>

<script type="module" src="assets/js/app.js"></script>
</body>
</html>
